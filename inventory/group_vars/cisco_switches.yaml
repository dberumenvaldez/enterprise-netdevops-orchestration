---
ansible_connection: network_cli
ansible_network_os: cisco.ios.ios
ansible_user: admin
ansible_password: Cisco123!
ansible_become: yes
ansible_become_method: enable
ansible_become_password: Cisco123!

ansible_network_cli_ssh_type: paramiko
ansible_ssh_common_args: '-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes256-cbc,aes128-cbc'

# cpnifguration
campus_vlans:
  - vlan_id: 10
    name: DATA
  - vlan_id: 20
    name: VoIP
  - vlan_id: 99
    name: NATIVE_DEFAULT

trunk_interfaces:
  DIST-01:
    - GigabitEthernet0/2
    - GigabitEthernet0/3
    - GigabitEthernet1/0
  DIST-02:
    - GigabitEthernet0/2
    - GigabitEthernet0/3
    - GigabitEthernet1/0
  ACC-01:
    - GigabitEthernet0/1
    - GigabitEthernet0/2
  ACC-02:
    - GigabitEthernet0/1
    - GigabitEthernet0/2