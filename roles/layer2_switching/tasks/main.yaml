---
- name: Configure Vlan Data Base in all switches
  cisco.ios.ios_vlans:
    config: "{{ campus_vlans }}"
    state: merged
  register: vlan_result

- name: Show status injection 
  ansible.builtin.debug:
    msg: "New Vlans add on Data Base"
  when: vlan_result.changed

- name: Configure trunk links 802.1Q
  cisco.ios.ios_l2_interfaces:
    config:
      - name: "{{ item }}"
        mode: trunk
        trunk: 
          encapsulation: dot1q
          native_vlan: 99
          allowed_vlans: 10,20,99
    state: merged
  loop: "{{ trunk_interfaces[inventory_hostname] | default([]) }}"

- name: Configure Rapid-PVST+
  cisco.ios.ios_config:
    lines:
      - spanning-tree mode rapid-pvst

- name: Stablish DIST-01 like ROOT Brigdge
  cisco.ios.ios_config:
    lines:
      - spanning-tree vlan 10,20,99 root primary
  when: inventory_hostname == 'DIST-01'  

- name: Stablish DIST-01 like ROOT Brigdge
  cisco.ios.ios_config:
    lines:
      - spanning-tree vlan 10,20,99 root secondary
  when: inventory_hostname == 'DIST-02'

- name: Enable DHCP snooping and DAI
  cisco.ios.ios_config:
    lines:
      - ip dhcp snooping
      - ip dhcp snooping vlan 10-20
      - ip arp inspection vlan 10-20
      - no ip dhcp snooping information option
  when: inventory_hostname in ['ACC-01','ACC-02']

- name: Apply Port security on access ports
  cisco.ios.ios_config:
    parents: interface GigabitEthernet1/0
    lines:
      - switchport port-security
      - switchport port-security maximum 1
      - switchport port-security mac-address sticky
      - switchport port-security violation restrict
  when: inventory_hostname in ['ACC-01','ACC-02']

- name: Configure Trusted ports to distribution layer
  cisco.ios.ios_config:
    parents: Interface range GigabitEthernet0/1-2
    lines:
      - ip dhcp snooping trust
      - ip arp inspection trust
  when: inventory_hostname in ['ACC-01','ACC-02']


- name: Save running-config on startup-config
  cisco.ios.ios_config:
    save_when: modified